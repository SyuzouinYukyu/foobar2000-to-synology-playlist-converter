name: Publish v1.1.8 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.1.8.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v1.1.8
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG_NAME: v1.1.8
      EXE_NAME: foobar2000_to_Synology_Playlist_Converter_v1.1.8.exe
      SOURCE_ZIP_NAME: foobar2000_to_Synology_Playlist_Converter_v1.1.8_source.zip
      EXPECTED_EXE_SHA256: 553D7C2FAF1C31EF2D74F387BFB413762D507FFA40ADDBB37DCE2328E879E681
      EXPECTED_SOURCE_SHA256: 77507A8BC6E697A089E08B751AF162A2170DBEE8A35454CF759E963A82FC0D7D

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore public source archive
        shell: pwsh
        run: |
          & .\source\v1.1.8\Restore-SourceArchive.ps1
          $sourceZip = Join-Path $PWD "source\v1.1.8\$env:SOURCE_ZIP_NAME"
          $sourceHash = (Get-FileHash -LiteralPath $sourceZip -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($sourceHash -ne $env:EXPECTED_SOURCE_SHA256) {
            throw "Source SHA-256 mismatch. Expected=$env:EXPECTED_SOURCE_SHA256 Actual=$sourceHash"
          }
          Expand-Archive -LiteralPath $sourceZip -DestinationPath .\build-src -Force

      - name: Publish Windows single-file EXE
        shell: pwsh
        run: |
          dotnet publish .\build-src\foobar2000_to_Synology_Playlist_Converter.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\publish

          $exe = Join-Path $PWD "publish\$env:EXE_NAME"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Published EXE was not found: $exe"
          }

          $exeHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToUpperInvariant()
          $exeSize = (Get-Item -LiteralPath $exe).Length
          Write-Host "EXE size: $exeSize"
          Write-Host "EXE SHA-256: $exeHash"
          if ($exeHash -ne $env:EXPECTED_EXE_SHA256) {
            throw "EXE SHA-256 mismatch. Release stopped. Expected=$env:EXPECTED_EXE_SHA256 Actual=$exeHash"
          }

      - name: Run self-test on release EXE
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "publish\$env:EXE_NAME"
          $stdout = Join-Path $PWD 'self-test.stdout.txt'
          $stderr = Join-Path $PWD 'self-test.stderr.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $out = Get-Content -LiteralPath $stdout -Raw -ErrorAction SilentlyContinue
          $err = Get-Content -LiteralPath $stderr -Raw -ErrorAction SilentlyContinue
          Write-Host $out
          if ($p.ExitCode -ne 0) { throw "Self-test failed: exit code $($p.ExitCode)" }
          if ($out -notmatch 'SELF_TEST_OK') { throw 'SELF_TEST_OK was not emitted.' }
          if (-not [string]::IsNullOrWhiteSpace($err)) { throw "Self-test stderr was not empty: $err" }

      - name: Prepare release assets
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "publish\$env:EXE_NAME"
          $sourceZip = Join-Path $PWD "source\v1.1.8\$env:SOURCE_ZIP_NAME"
          $exeHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToUpperInvariant()
          $sourceHash = (Get-FileHash -LiteralPath $sourceZip -Algorithm SHA256).Hash.ToUpperInvariant()
          @(
            "$exeHash  $env:EXE_NAME",
            "$sourceHash  $env:SOURCE_ZIP_NAME"
          ) | Set-Content -LiteralPath .\SHA256SUMS-v1.1.8.txt -Encoding utf8

      - name: Create v1.1.8 release and upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Join-Path $PWD "publish\$env:EXE_NAME"
          $sourceZip = Join-Path $PWD "source\v1.1.8\$env:SOURCE_ZIP_NAME"

          gh release view $env:TAG_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:TAG_NAME `
              --repo $env:GITHUB_REPOSITORY `
              --title "foobar2000 to Synology Playlist Converter v1.1.8" `
              --notes-file .\RELEASE_NOTES_v1.1.8.md `
              --latest
          } else {
            gh release create $env:TAG_NAME `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "foobar2000 to Synology Playlist Converter v1.1.8" `
              --notes-file .\RELEASE_NOTES_v1.1.8.md `
              --latest
          }

          gh release upload $env:TAG_NAME `
            $exe `
            $sourceZip `
            .\SHA256SUMS-v1.1.8.txt `
            --repo $env:GITHUB_REPOSITORY `
            --clobber

      - name: Verify published release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG_NAME" | ConvertFrom-Json
          if ($release.draft -or $release.prerelease) { throw 'Release is draft or prerelease.' }
          $assets = @($release.assets)
          foreach ($name in @($env:EXE_NAME, $env:SOURCE_ZIP_NAME, 'SHA256SUMS-v1.1.8.txt')) {
            if (-not ($assets.name -contains $name)) { throw "Release asset missing: $name" }
          }
          $exeAsset = $assets | Where-Object name -eq $env:EXE_NAME
          if ($exeAsset.size -ne 161832216) { throw "Unexpected EXE asset size: $($exeAsset.size)" }
          if ($exeAsset.digest -and $exeAsset.digest -ne ('sha256:' + $env:EXPECTED_EXE_SHA256.ToLowerInvariant())) {
            throw "Published EXE digest mismatch: $($exeAsset.digest)"
          }
          Write-Host "RELEASE_OK"
